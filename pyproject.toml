[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cf-ai-gateway-tracker"
version = "0.1.0"
description = "Unified AI usage tracking through Cloudflare AI Gateway. Omarchy panel applet for Xiaomi MiMo, OpenAI, Anthropic, Grok, Workers AI, and BYOK providers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Hans Koch", email = "hans@hansakoch.com"},
]
keywords = ["cloudflare", "ai-gateway", "analytics", "omarchy", "xiaomi", "mimo", "openai", "usage-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/hansakoch/cf-ai-gateway-tracker"
Documentation = "https://github.com/hansakoch/cf-ai-gateway-tracker#readme"
Repository = "https://github.com/hansakoch/cf-ai-gateway-tracker"
Issues = "https://github.com/hansakoch/cf-ai-gateway-tracker/issues"

[project.scripts]
cf-gateway-tracker = "collector:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
